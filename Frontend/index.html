    <style>
      #app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        gap: 16px;
      }
      #app-loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: app-loader-spin 0.8s linear infinite;
      }
      #app-loader p {
        margin: 0;
        font-size: 14px;
        color: #64748b;
        font-weight: 500;
      }
      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>

  <body>
    <div id="root">
      <div id="app-loader" role="status" aria-live="polite" aria-label="Loading DietDesk">
        <div id="app-loader-spinner" aria-hidden="true"></div>
        <p>Loading DietDesk…</p>
      </div>
    </div>

        <p>
